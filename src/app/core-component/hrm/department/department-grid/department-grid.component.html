<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>Department</h4>
      <h6>Manage your department</h6>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a (click)="loadDepartments()" data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Refresh" matTooltipPosition="above"><i
          class="ti ti-refresh"></i></a>
    </li>
    <li>
      <a (click)="toggleCollapse()" [class.active]="isCollapsed" data-bs-toggle="tooltip" data-bs-placement="top"
        matTooltip="Collapse" matTooltipPosition="above" id="collapse-header"> @if (!isCollapsed) {
        <i class="ti ti-chevron-up"></i>
        }
        @if (isCollapsed) {
        <i class="ti ti-chevron-up"></i>
        }</a>
    </li>
  </ul>
  <div class="page-btn">
    <a href="javascript:void(0);" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add-department"><i
        class="ti ti-circle-plus me-2"></i>Add New Department</a>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between flex-wrap row-gap-3">        
    </div>
  </div>
</div>


<div class="depaartment-grid-widget">
  <div class="row">
    <div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6" *ngFor="let department of departments">
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="d-inline-flex align-items-center">
              <i class="ti ti-point-filled text-success fs-20"></i>{{ department.name }}
            </h5>
            <div class="dropdown">
              <a href="javascript:void(0);" class="action-icon border-0" data-bs-toggle="dropdown"
                aria-expanded="false"><i class="feather icon-more-vertical feather-user"></i></a>
              <ul class="dropdown-menu dropdown-menu-end ">
                <li>
                  <a href="javascript:void(0);" class="dropdown-item" data-bs-toggle="modal"
                    data-bs-target="#edit-department" (click)="openEditModal(department)"><i data-feather="edit" class="info-img me-2"></i>Edit</a>
                </li>
                <li>
                  <a (click)="confirmDelete(department)" href="javascript:void(0);" class="dropdown-item mb-0" data-bs-toggle="modal"
                    data-bs-target="#delete-modal"><i data-feather="trash-2" class="info-img me-2"></i>Delete</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="bg-light rounded p-3 text-center mb-4">
            <h4>{{ department.hod }}</h4>
          </div>        
        </div>
      </div>
    </div>
  </div>
</div>


<!-- delete modal -->
<div class="modal fade" id="delete-modal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="page-wrapper-new p-0">
        <div class="content p-5 px-3 text-center">
          <span class="rounded-circle d-inline-flex p-2 bg-danger-transparent mb-2"><i
              class="ti ti-trash fs-24 text-danger"></i></span>
          <h4 class="fs-20 text-gray-9 fw-bold mb-2 mt-1">Delete Department</h4>
          <p class="text-gray-6 mb-0 fs-16">Are you sure you want to delete department?</p>
          <div class="modal-footer-btn mt-3 d-flex justify-content-center">
            <button #closeButtonForDeleteDepartment type="button" class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3 shadow-none"
              data-bs-dismiss="modal">Cancel</button>
            <button (click)="onDeleteConfirmed()" type="submit" class="btn btn-submit fs-13 fw-medium p-2 px-3" data-bs-dismiss="modal">Yes
              Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /delete modal -->


<!-- Add Department modal START -->

<div class="modal fade" id="add-department">
  <div class="modal-dialog modal-dialog-centered custom-modal-two">
    <div class="modal-content">
      <div class="page-wrapper-new p-0">
        <div class="content">
          <div class="modal-header border-0 custom-modal-header">
            <div class="page-title">
              <h4>Create Department</h4>
            </div>
            <button #closeButton type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body custom-modal-body">
            <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
              <div class="mb-0">
                <label class="form-label">Department Name</label>
                <input type="text" class="form-control" formControlName="name">
              </div>
              <div class="mb-0 mt-3">
                <label class="form-label">Head of Department (HOD)</label>
                <input type="text" class="form-control" formControlName="hod">
              </div>
              <div class="mb-0 mt-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" formControlName="description"></textarea>
              </div>
              <div class="col-lg-12">
                <div class="status-toggle modal-status d-flex justify-content-between align-items-center">
                  <span class="status-label">Status</span>
                  <input type="checkbox" id="userStatus" class="check" formControlName="status">
                  <label for="userStatus" class="checktoggle"></label>
                </div>
              </div>
              <div class="modal-footer-btn mt-4">
                <button type="button" class="btn btn-cancel me-2" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-submit" [disabled]="departmentForm.invalid">Create
                  Department</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Department modal END -->

<!-- Edit Department modal START -->

<div class="modal fade" id="edit-department">
  <div class="modal-dialog modal-dialog-centered custom-modal-two">
    <div class="modal-content">
      <div class="page-wrapper-new p-0">
        <div class="content">
          <div class="modal-header border-0 custom-modal-header">
            <div class="page-title">
              <h4>Edit Department</h4>
            </div>
            <button #closeButtonForEditDepartment type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body custom-modal-body">
            <form [formGroup]="editDepartmentForm" (ngSubmit)="onEditSubmit()">
              <div class="mb-0">
                <label class="form-label">Department Name</label>
                <input type="text" class="form-control" formControlName="name">
              </div>
              <div class="mb-0 mt-3">
                <label class="form-label">Head of Department (HOD)</label>
                <input type="text" class="form-control" formControlName="hod">
              </div>
              <div class="mb-0 mt-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" formControlName="description"></textarea>
              </div>
              <div class="col-lg-12">
                <div class="status-toggle modal-status d-flex justify-content-between align-items-center">
                  <span class="status-label">Status</span>
                  <input type="checkbox" id="editUserStatus" class="check" formControlName="status">
                  <label for="editUserStatus" class="checktoggle"></label>
                </div>
              </div>
              <div class="modal-footer-btn mt-4">
                <button type="button" class="btn btn-cancel me-2" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-submit" [disabled]="editDepartmentForm.invalid">Update
                  Department</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Department modal END -->
